name: Build

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      java_version:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # Two toolchains, because 1.21.1 and 1.21.11 build on Java 21 and 26.1 onward on Java 25.
      # Gradle picks the right one per target from the versions declared in build.gradle.kts.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ inputs.java_version }}
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build every Minecraft version
        run: ./gradlew buildAll --stacktrace

      # Mixin targets are strings javac never checks, so each is checked against the game it will be applied to.
      - name: Check mixin targets
        run: python3 tools/check-mixin-targets.py

      # One jar per target, but a target accepts older NeoForge builds than it compiles against, and 26.1
      # accepts older Minecraft too. Each is checked at the oldest build its metadata lets it load on.
      # 1.21.11 and 26.3 start at the build they compile against, which the step above already covers.
      - name: Check each jar at the oldest build it accepts
        run: |
          check() {
            ./gradlew ":$1:writeCompileClasspath" -Pneo_version="$2" -Pminecraft_version="$3" --stacktrace
            python3 tools/check-linkage.py "$1" "$2"
            python3 tools/check-mixin-targets.py "$1" --neoforge "$2"
          }
          check 1.21.1 21.1.217 1.21.1
          check 26.1 26.1.0.19-beta 26.1
          check 26.1 26.1.1.15-beta 26.1.1
          check 26.2 26.2.0.76 26.2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: versions/*/build/libs/*.jar
