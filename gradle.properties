# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Mod Properties
# Per-version properties live in versions/<target>/gradle.properties

# The unique mod identifier. Kept identical to upstream so configs, keybinds, permission nodes and the
# network channel names all carry over unchanged, and so the two cannot be installed side by side.
mod_id=do_a_barrel_roll
mod_name=Do Another Barrel Roll
mod_license=GPL-3.0-only
mod_version=3.7.4
mod_group_id=nl.enjarai.doabarrelroll
# Base name of the built jar, published as <archives_name>-<mod_version>+<minecraft_version>.jar
archives_name=DoAnotherBarrelRoll
