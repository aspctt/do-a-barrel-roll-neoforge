# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment supplies real parameter names and javadoc on top of the official
# Mojang mappings. https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# Latest NeoForge builds: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.1
minecraft_version_range=[1.21, 1.21.2)
neo_version=21.1.249
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

## Mod Properties

# The unique mod identifier. Kept identical to upstream so configs, keybinds,
# permission nodes, and the network channel names all carry over unchanged.
mod_id=do_a_barrel_roll
mod_name=Do Another Barrel Roll
mod_license=GPL-3.0-only
mod_version=3.7.3
mod_group_id=nl.enjarai.doabarrelroll
# Name the built jar is published under. Version and Minecraft version are
# appended by the build, giving DoAnotherBarrelRoll-<version>+<mc>.jar
archives_name=DoAnotherBarrelRoll

## Dependency versions

# Yet Another Config Lib powers the in-game config screen. Optional at runtime:
# without it the config button opens a prompt offering to install it.
yacl_version=3.8.1+1.21.1-neoforge
# Minimum YACL the config screen will talk to, checked at runtime.
yacl_min_version=3.6.0
